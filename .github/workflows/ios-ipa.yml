name: iOS .ipa (unsigned, for sideloading)

# Produces an UNSIGNED .ipa on a macOS runner. Download the artifact and install
# it onto an iPhone from Windows with Sideloadly or AltStore (AltServer for
# Windows) - those tools re-sign it with your free Apple ID (7-day, refresh
# weekly). Nothing here needs an Apple Developer account or signing secrets.
#
# It uses the runner's PRE-INSTALLED .NET SDK + `ios` workload + Xcode, which
# GitHub keeps version-matched. Do NOT add `setup-dotnet` / `dotnet workload
# restore` here - a fresh SDK pulls the newest .NET-for-iOS, which usually needs
# a newer Xcode than the image has and the build fails the Xcode version gate.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HopMedvedek iOS/**'
      - 'HopMedvedek/**'
      - 'Express/**'
      - 'Artificial/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          dotnet --info | head -n 15
          dotnet workload list

      - name: Build unsigned .app (Release, device arm64)
        run: >
          dotnet build "HopMedvedek iOS/HopMedvedek.iOS.csproj"
          -c Release
          -r ios-arm64
          -p:EnableCodeSigning=false
          -p:DisableCodesignVerification=true
          -p:MtouchLink=SdkOnly

      - name: Package .app into an .ipa (Payload/ zip)
        run: |
          set -euo pipefail
          APP=$(find "HopMedvedek iOS/bin/Release" -type d -name "HopMedvedek.iOS.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::HopMedvedek.iOS.app not found"; exit 1; fi
          echo "App bundle: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry HopMedvedek.iOS.ipa Payload )
          ls -lh out/HopMedvedek.iOS.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HopMedvedek-iOS-unsigned-ipa
          path: out/HopMedvedek.iOS.ipa
          if-no-files-found: error
          retention-days: 14
