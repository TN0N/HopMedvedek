name: iOS .ipa (unsigned, for sideloading)

# Produces an UNSIGNED .ipa on a macOS runner. Download the artifact and install
# it onto an iPhone from Windows with Sideloadly or AltStore (AltServer for
# Windows) - those re-sign it with your free Apple ID (7-day, refresh weekly).
# No Apple Developer account, no signing secrets, no Mac.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'HopMedvedek iOS/**'
      - 'HopMedvedek/**'
      - 'Express/**'
      - 'Artificial/**'
      - 'global.json'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global.json pins .NET 9 (the runner default is .NET 10, which has no iOS
      # workload here). setup-dotnet makes sure a 9.0.x SDK is present.
      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Environment
        run: |
          dotnet --version
          dotnet --list-sdks
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Restore the iOS workload
        run: dotnet workload restore "HopMedvedek iOS/HopMedvedek.iOS.csproj"

      - name: Select the Xcode that matches the restored iOS workload
        run: |
          set -e
          REQ=$(ls -d "$HOME"/.dotnet/packs/Microsoft.iOS.Sdk.net9.0_*/ 2>/dev/null \
                | sed -E 's#.*net9\.0_([0-9]+\.[0-9]+)/?$#\1#' | sort -V | tail -1)
          echo "iOS workload requires Xcode: ${REQ:-unknown}"
          {
            echo "### iOS build toolchain"
            echo "- Workload wants Xcode: \`${REQ:-unknown}\`"
            echo "- Installed Xcodes:"
            for a in /Applications/Xcode*.app; do echo "  - \`$a\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          XAPP=$(ls -d /Applications/Xcode_${REQ}*.app 2>/dev/null | sort -V | head -1)
          if [ -z "$XAPP" ]; then
            echo "::error::Xcode $REQ is not installed on this runner. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' '). Pin the iOS workload to a matching version instead."
            exit 1
          fi
          echo "Selecting $XAPP"
          sudo xcode-select -s "$XAPP/Contents/Developer"
          xcodebuild -version

      - name: Build unsigned .app (Release, device arm64)
        run: >
          dotnet build "HopMedvedek iOS/HopMedvedek.iOS.csproj"
          -c Release
          -r ios-arm64
          -p:EnableCodeSigning=false
          -p:DisableCodesignVerification=true
          -p:MtouchLink=SdkOnly

      - name: Package .app into an .ipa (Payload/ zip)
        run: |
          set -euo pipefail
          APP=$(find "HopMedvedek iOS/bin/Release" -type d -name "HopMedvedek.iOS.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::HopMedvedek.iOS.app not found"; exit 1; fi
          echo "App bundle: $APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry HopMedvedek.iOS.ipa Payload )
          ls -lh out/HopMedvedek.iOS.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: HopMedvedek-iOS-unsigned-ipa
          path: out/HopMedvedek.iOS.ipa
          if-no-files-found: error
          retention-days: 14
